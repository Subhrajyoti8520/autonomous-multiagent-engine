[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous_multiagent_engine"
version = "0.1.0"
description = "AI-powered deal scraper and evaluator using multi-agent systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Web & API
    "fastapi[all]>=0.103.0",
    "streamlit>=1.30.0",
    "plotly>=5.17.0",
    "gradio>=4.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "feedparser>=6.0.10",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.3",
    "python-dotenv>=1.0.0",

    # LLM & Multi-Agent Frameworks
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
    "ollama>=0.1.6",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "chromadb>=0.4.15",
    "sentence-transformers>=2.2.2",
    "litellm>=1.100.0",

    # Machine Learning & Compute
    "torch>=2.1.0",
    "torchvision",
    "torchaudio",
    "transformers>=4.35.0",
    "datasets==3.6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",

    # Utilities & Monitoring
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
    "modal>=0.58.0",
    "psutil>=5.9.0",
    "speedtest-cli>=2.1.3",
    "pydub>=0.25.1",
    "setuptools>=68.0.0",
    "protobuf==3.20.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.25.0",
    "ruff>=0.1.3",
    "black>=23.9.1",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.0.0",
    "jupyter-dash>=0.4.2",
    "matplotlib>=3.8.0",
    "plotly>=5.17.0",
]

# Configure uv to pull CUDA wheels for PyTorch automatically
[tool.uv]
find-links = [
    "https://download.pytorch.org/whl/cu124"
]