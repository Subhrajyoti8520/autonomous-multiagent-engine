services:
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: agent_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PRICER_MODEL_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - NTFY_URL=${NTFY_URL}
      - NTFY_TOPIC=${NTFY_TOPIC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    # Inject the fix right before boot
    command: >
      bash -c "pip install 'litellm==1.97.0' plotly && streamlit run src/ui/app.py --server.port=8501 --server.address=0.0.0.0"